<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird Remake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <h1 class="title">FLAPPY <span>BIRD</span></h1>
    <p class="subtitle">A tiny remake of the hit game — Space / Click / Tap to flap</p>

    <div class="frame">
      <canvas id="game" width="400" height="600"></canvas>
    </div>

    <div class="controls-hint">
      <kbd>Space</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> flap &nbsp;•&nbsp; <kbd>P</kbd> pause &nbsp;•&nbsp; <kbd>R</kbd> restart
    </div>

    <footer>
      Built with HTML5 Canvas — no assets, no libraries. Best score is saved locally.
    </footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
